name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: test
      ASSESSMENT_PROVIDER: blocked
      APP_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://humaniti:placeholder@localhost:5432/humaniti_ai?schema=public
      PRIVATE_MEDIA_ROOT: ./.private/media
      MAX_UPLOAD_BYTES: 2147483648

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml

      - name: Install system dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify FFmpeg and ffprobe installation
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install Node dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest test suite
        run: npm test

      - name: Install Python worker dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./worker[test]"

      - name: Run Python worker smoke test
        run: npm run worker:smoke

      - name: Run Python worker pytest suite
        run: npm run worker:test

      - name: Build background worker
        run: npm run worker:build

      - name: Build Next.js application
        env:
          NODE_ENV: production
        run: npm run build
