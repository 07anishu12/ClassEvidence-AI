[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humaniti-worker"
version = "0.1.0"
description = "Private media-processing foundation for Humaniti AI"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
humaniti-worker = "humaniti_worker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
